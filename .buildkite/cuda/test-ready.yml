# CUDA CI L2 (`core_model` e2e) plus L1 CPU Simple Test (`core_model and cpu`).
# Uploaded by Upload Ready Pipeline: PR label `ready`, or main+WEEKLY=1 with --e2e.

env:
  VLLM_WORKER_MULTIPROC_METHOD: spawn
  HF_HUB_DOWNLOAD_TIMEOUT: 300
  HF_HUB_ETAG_TIMEOUT: 60

steps:
  - group: ":card_index_dividers: Simple Test"
    depends_on: upload-ready-pipeline
    steps:
      - label: "Simple · Model Executor Test"
        timeout_in_minutes: 20
        commands:
          - "pytest -sv tests/model_executor -m 'core_model and cpu'"
        mirror_hardwares: l4_1

      - label: "Simple · Diffusion Test"
        timeout_in_minutes: 20
        commands:
          - "pytest -sv tests/diffusion -m 'core_model and cpu'"
        mirror_hardwares: l4_1

      - label: "Simple · Engine&Entrypoints Test"
        timeout_in_minutes: 20
        commands:
          - "pytest -sv tests/entrypoints tests/engine -m 'core_model and cpu'"
        mirror_hardwares: l4_1

      - label: "Simple · Other Test"
        timeout_in_minutes: 20
        commands:
          - "pytest -sv tests/ -m 'core_model and cpu' --ignore=tests/diffusion --ignore=tests/model_executor --ignore=tests/entrypoints --ignore=tests/engine"
        mirror_hardwares: l4_1

  - group: ":card_index_dividers: Diffusion Test"
    depends_on: upload-ready-pipeline
    steps:

      - label: "Diffusion · FlashAttention Test"
        timeout_in_minutes: 20
        commands:
          - timeout 15m pytest -s -v tests/diffusion/attention/ -m 'core_model and cuda and L4 and cards_1' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Offloader Test"
        commands:
          - timeout 40m pytest -s -v tests/diffusion/offloader -m "core_model and cuda" --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Cache Test"
        commands:
          - timeout 15m pytest -sv tests/diffusion/cache -m 'core_model and cuda' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Batch Test"
        commands:
          - timeout 15m pytest -sv tests/diffusion/batching -m 'core_model and cuda' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Distributed Test · Single-GPU"
        source_file_dependencies: diffusion_distributed_attention
        commands:
          - timeout 20m pytest -sv tests/diffusion/distributed -m 'core_model and cuda and L4 and cards_1' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Distributed Test · 2-GPU"
        source_file_dependencies: diffusion_distributed_attention
        commands:
          - timeout 20m pytest -sv tests/diffusion/distributed -m 'core_model and cuda and L4 and cards_2' --run-level "core_model"
        mirror_hardwares: l4_2

      - label: "Diffusion · Distributed & Attention Test · 4-GPU"
        source_file_dependencies: diffusion_distributed_attention
        commands:
          - timeout 20m pytest -sv tests/diffusion/distributed -m 'core_model and cuda and L4 and cards_4' --run-level "core_model"
          - timeout 20m pytest -sv tests/diffusion/attention/test_attention_sp.py -m 'core_model and cuda and L4 and cards_4' --run-level "core_model"
        mirror_hardwares: l4_4

      - label: "Diffusion · Model Test"
        commands:
          - timeout 15m pytest -sv tests/diffusion/models/ -m 'core_model and cuda' --run-level "core_model"
        mirror_hardwares: l4_1

      - label: "Diffusion · Other Test"
        commands:
          - timeout 15m pytest -sv tests/diffusion/*.py tests/diffusion/ar_diffusion -m 'core_model and cuda' --run-level "core_model"
        mirror_hardwares: l4_1

  - group: ":card_index_dividers: Tiny Model Tests [Single GPU]"
    depends_on: upload-ready-pipeline
    steps:

      - label: "Tiny Model Tests · Diffusion (base)"
        commands:
          - timeout 15m pytest -sv -n 4 tests/model_tests/diffusion -m 'core_model and cuda' --run-level "core_model"
        mirror_hardwares: l4_1

  - label: "Engine&Model Executor Test"
    depends_on: upload-ready-pipeline
    commands:
      - |
        timeout 15m bash -c "
                  pytest -sv tests/engine/ tests/model_executor/ tests/worker/test_batched_omni_output.py tests/worker_v2/ -m 'core_model and cuda' --run-level 'core_model'
        "
    mirror_hardwares: l4_1

  - label: "Distributed Test"
    depends_on: upload-ready-pipeline
    commands:
      - |
        timeout 20m bash -c "
          pytest -sv tests/distributed/ -m 'core_model and cuda and L4' --run-level 'core_model'
        "
    mirror_hardwares: l4_1

  - label: "Entrypoints Test"
    depends_on: upload-ready-pipeline
    commands:
      - |
        timeout 30m bash -c "
          export VLLM_WORKER_MULTIPROC_METHOD=spawn
          pytest -sv tests/entrypoints/ -m 'core_model and cuda' --run-level 'core_model'
        "
    mirror_hardwares: l4_1

  - group: ":card_index_dividers: E2E Test"
    depends_on: upload-ready-pipeline
    steps:
      - label: "Custom Pipeline Test"
        source_file_dependencies: custom_pipeline
        commands:
          - timeout 20m pytest -s -v tests/e2e/features/custom_pipeline/ -m "core_model"
        mirror_hardwares: l4_1


      - label: "RLHF · VeRL-Omni E2E Test"
        source_file_dependencies: rlhf_verl_omni
        commands:
          - |
            timeout 20m bash -c "
              pytest -s -v tests/e2e/features/rlhf_test/test_verl_omni_e2e.py
            "
        mirror_hardwares: l4_1

      - label: "Omni · Fun-Audio-Chat Test"
        source_file_dependencies: omni_funaudiochat_function
        # FA2 builds against this image's Torch ABI before the model checks.
        timeout_in_minutes: 90
        commands:
          - |
            set -euo pipefail
            export FUN_AUDIO_CHAT_HOME="$(mktemp -d /tmp/funaudiochat-ci.XXXXXX)"
            git clone https://github.com/FunAudioLLM/Fun-Audio-Chat.git "$FUN_AUDIO_CHAT_HOME"
            git -C "$FUN_AUDIO_CHAT_HOME" checkout 8ba984b64b4880918db2807e08d795475481200c
            export PYTHONPATH="$PWD:$FUN_AUDIO_CHAT_HOME:${PYTHONPATH:-}"
            export VLLM_USE_FLASHINFER_SAMPLER=0
            # The vLLM base image supplies nvcc; compile only for these H100s.
            python -c "from pathlib import Path; from torch.utils.cpp_extension import CUDA_HOME; assert CUDA_HOME and (Path(CUDA_HOME) / 'bin/nvcc').is_file(), 'A CUDA toolkit with nvcc is required'"
            python -m pip install --no-deps packaging psutil ninja setuptools wheel
            export FLASH_ATTENTION_FORCE_BUILD=TRUE FLASH_ATTN_CUDA_ARCHS=90
            export MAX_JOBS=4 NVCC_THREADS=2
            python -m pip install --no-build-isolation --no-deps --no-cache-dir --force-reinstall \
              'https://files.pythonhosted.org/packages/01/7a/92a46e7cd6bbb4d7b2855a457c3b855df54a97af5656d98fc92e58e61065/flash_attn-2.8.3.post1.tar.gz#sha256=55d5103ed846da8b56e0797acf4bde07dee4b1c7e8907fcfc6699c203030c348'
            python -c "import flash_attn; from funaudiochat.modeling_funaudiochat import FunAudioChatDecoder"
            # Resolve immutable checkpoints before passing local paths to both stages.
            FUNAUDIOCHAT_MODEL="$(hf download FunAudioLLM/Fun-Audio-Chat-8B --revision 7bf72dc7c705493f817178a0859efff91e9cf73c)"
            FUNAUDIOCHAT_CODEC_DIR="$(hf download FunAudioLLM/Fun-CosyVoice3-0.5B-2512 --revision 29e01c4e8d000f4bcd70751be16fa94bf3d85a18)"
            export FUNAUDIOCHAT_MODEL FUNAUDIOCHAT_CODEC_DIR
            export FUNAUDIOCHAT_DEPLOY_CONFIG="$FUN_AUDIO_CHAT_HOME/omni-deploy.yaml"
            python - <<'PYCONFIG'
            import os
            from pathlib import Path
            import yaml
            config = yaml.safe_load(Path("vllm_omni/deploy/funaudiochat.yaml").read_text())
            config["stages"][1]["model"] = os.environ["FUNAUDIOCHAT_CODEC_DIR"]
            Path(os.environ["FUNAUDIOCHAT_DEPLOY_CONFIG"]).write_text(yaml.safe_dump(config, sort_keys=False))
            PYCONFIG
            pytest -s -v tests/e2e/offline_inference/test_fun_audio_chat.py tests/e2e/online_serving/test_fun_audio_chat.py -m 'core_model and cuda' --run-level core_model
        mirror_hardwares: h100_2

      - label: "Omni · Qwen3-Omni Test"
        source_file_dependencies: omni_qwen3_omni_function
        commands:
          - |
            timeout 20m bash -c "
              pytest -s -v tests/e2e/online_serving/test_qwen3_omni.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_2

      - label: "Omni · MiniCPM-o 4.5 Offline Test"
        source_file_dependencies: omni_minicpmo_4_5_function
        commands:
          - |
            timeout 20m bash -c "
              pytest -s -v tests/e2e/offline_inference/test_minicpmo_4_5.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Omni · MiniCPM-o 4.5 Online Test"
        source_file_dependencies: omni_minicpmo_4_5_function
        commands:
          - |
            timeout 20m bash -c "
              pytest -s -v tests/e2e/online_serving/test_minicpmo_4_5.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Omni · MiniCPM-o 4.5 Duplex Test"
        source_file_dependencies: omni_minicpmo_4_5_duplex_function
        commands:
          - |
            timeout 35m bash -c "
              pytest -s -v tests/e2e/online_serving/test_minicpmo_4_5_duplex.py tests/e2e/online_serving/test_duplex_client_live.py -m 'core_model and cuda' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Omni · MiniCPM-o 4.5 Perf Test"
        timeout_in_minutes: 60
        source_file_dependencies: omni_minicpmo_4_5_perf
        commands:
          - export BENCHMARK_DIR=tests/dfx/perf/results
          - pytest -s -v tests/dfx/perf/scripts/run_benchmark.py --test-config-file tests/dfx/perf/tests/test_minicpmo_4_5_ready.json -m 'core_model and cuda'
        mirror_hardwares: h100_1

      - label: "TTS · Qwen3-TTS CustomVoice Test"
        source_file_dependencies: tts_qwen3_tts_function
        commands:
          - |
            timeout 20m bash -c "
              export VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
              pytest -s -v tests/e2e/online_serving/test_qwen3_tts_customvoice.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: l4_1

      - label: "Diffusion · Wan22 Test"
        source_file_dependencies: diffusion_wan22_function
        commands:
          - |
            timeout 40m bash -c "
              export VLLM_IMAGE_FETCH_TIMEOUT=60
              pytest -s -v tests/e2e/online_serving/test_wan22_t2v.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Diffusion · Cosmos3 Test"
        source_file_dependencies: diffusion_cosmos3_function
        commands:
          - |
            timeout 40m bash -c "
              export VLLM_IMAGE_FETCH_TIMEOUT=60
              pytest -s -v tests/e2e/online_serving/test_cosmos3.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Diffusion · MiniMax-H3 DLO DP2 T2VA Test"
        timeout_in_minutes: 90
        source_file_dependencies: diffusion_minimax_h3_function
        commands:
          - |
            timeout 80m bash -c "
              export VLLM_IMAGE_FETCH_TIMEOUT=60
              pytest -s -v tests/e2e/online_serving/test_minimax_h3_dlo_dp2_t2va.py -m 'core_model and cuda and diffusion' --run-level 'core_model'
            "
        mirror_hardwares: h100_2

      - label: "Diffusion · Qwen Image Test"
        source_file_dependencies: diffusion_qwen_image_function
        commands:
          - |
            timeout 40m bash -c "
              export VLLM_IMAGE_FETCH_TIMEOUT=60
              pytest -s -v tests/e2e/online_serving/test_qwen_image.py -m 'core_model' --run-level 'core_model'
            "
        mirror_hardwares: h100_1

      - label: "Diffusion · HunyuanVideo-1.5 Test"
        source_file_dependencies: diffusion_hunyuan_video_function
        commands:
          - |
            timeout 40m bash -c "
              export VLLM_IMAGE_FETCH_TIMEOUT=60
              pytest -s -v tests/e2e/online_serving/test_hunyuan_video_15_expansion.py -m 'core_model and diffusion' --run-level 'core_model'
            "
        mirror_hardwares: h100_1
