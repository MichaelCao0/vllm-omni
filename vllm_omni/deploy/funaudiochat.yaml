# Speech input is consumed as a complete turn; output codec chunks stream
# asynchronously to CosyVoice3. This does not enable continuous input/duplex.
pipeline: funaudiochat
async_chunk: true
trust_remote_code: true
enable_prefix_caching: false
enable_chunked_prefill: false
dtype: bfloat16

connectors:
  funaudio_stream:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 65536
      codec_streaming: true
      codec_chunk_frames: 50
      initial_codec_chunk_frames: 10
      codec_pre_lookahead_frames: 3
      codec_flow_segment_frames: 200

stages:
  - stage_id: 0
    devices: "0"
    max_num_seqs: 4
    gpu_memory_utilization: 0.65
    max_model_len: 8192
    max_num_batched_tokens: 8192
    enforce_eager: true
    async_scheduling: false
    limit_mm_per_prompt:
      audio: 1
    output_connectors:
      to_stage_1: funaudio_stream
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      repetition_penalty: 1.0
      max_tokens: 2048
      stop_token_ids: [151645]
      seed: 42

  - stage_id: 1
    model: FunAudioLLM/Fun-CosyVoice3-0.5B-2512
    devices: "1"
    max_num_seqs: 4
    gpu_memory_utilization: 0.25
    max_model_len: 8192
    max_num_batched_tokens: 32768
    enforce_eager: true
    async_scheduling: false
    skip_tokenizer_init: true
    input_connectors:
      from_stage_0: funaudio_stream
    default_sampling_params:
      temperature: 0.0
      max_tokens: 1
      seed: 42
